[package]
name = "ransomguard"
version = "0.1.0"
edition = "2021"
description = "Terminal-side early ransomware detection: entropy surge, extension churn, ransom notes, canary files"

[lib]
name = "ransomguard"
path = "src/lib.rs"

[[bin]]
name = "ransomguard"
path = "src/main.rs"

[[bin]]
name = "sim_encryptor"
path = "src/bin/sim_encryptor.rs"

[dependencies]
notify = "7"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
chrono = { version = "0.4", features = ["clock"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
