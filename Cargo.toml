[package]
name = "ransomwatch"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Endpoint-side early ransomware detection: watches a directory, scores writes by entropy, extension churn, ransom notes and decoy files"
license = "MIT OR Apache-2.0"

[dependencies]
notify = "8.2.2"
sysinfo = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
sha2 = "0.10"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
opt-level = 2
debug = 1
