[package]
name = "ransomwatch"
description = "Terminal-side early-detection monitor for ransomware-like file activity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "ransomwatch"
path = "src/lib.rs"

[[bin]]
name = "ransomwatch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
filetime = "0.2.29"
libc = "0.2.191"
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
toml = "0.8.23"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
